[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "volt-aimc"
version = "0.2.0"
description = "Python bindings for VOLT — Virtual Ohmic Logic Testbench"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.maturin]
manifest-path = "crates/volt-py/Cargo.toml"
module-name = "volt"
